# CI cho Thuc Coffee — chay khi push hoac mo PR len nhanh main.
# File nay chay tren may ao cua GitHub, KHONG lien quan Dokploy hay Compose tren may ban.

name: CI

# "on" = khi nao pipeline chay.
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

# "jobs" = cac cong viec. Moi job chay tren mot may ao rieng, song song voi nhau.
jobs:
  # --- Job 1: kiem tra source code ---
  lint-and-build:
    runs-on: ubuntu-latest # may ao Ubuntu do GitHub cap, dung xong xoa
    steps:
      # Tai code cua repo ve may ao
      - name: Checkout code
        uses: actions/checkout@v4

      # Cai Node 22 (khop voi node:22-alpine trong Dockerfile), bat cache npm cho nhanh
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            server/package-lock.json

      # npm ci = cai dung phien ban trong package-lock.json (nghiem ngat hon npm install)
      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # Backend co package-lock rieng. Phai cai TRUOC buoc Build frontend:
      # tsc cua frontend di theo import type vao server/src/**/*.schemas.ts,
      # cac file do import zod/drizzle-orm nen can server/node_modules de resolve.
      - name: Install server dependencies
        working-directory: server
        run: npm ci

      # Chay lint — bao do neu co loi
      - name: Lint
        working-directory: frontend
        run: npm run lint

      # Build production — bao do neu TypeScript hoac Vite loi
      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Lint server
        working-directory: server
        run: npm run lint

      - name: Build server
        working-directory: server
        run: npm run build

  # --- Job 2: kiem tra ca hai Docker image build duoc tren may sach ---
  # Chi build, khong chay container: nginx cua frontend proxy /api va /media
  # toi service "backend"/"minio" trong mang compose, nen container FE dung
  # mot minh se chet ngay luc khoi dong (host not found in upstream). Kiem tra
  # runtime end-to-end la viec cua `docker compose up` khi deploy that.
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Build image frontend tu frontend/Dockerfile, context van la root vi
      # tsc frontend can thay server/src/**/*.schemas.ts (type-only import)
      - name: Build frontend image
        run: docker build --target runtime -f frontend/Dockerfile -t thuccoffee:ci .

      # Build image backend tu server/Dockerfile — bat loi tsc/deps tren may sach
      - name: Build backend image
        run: docker build --target runtime -t thuccoffee-backend:ci ./server
