# CI cho Thuc Coffee — chay khi push hoac mo PR len nhanh main.
# File nay chay tren may ao cua GitHub, KHONG lien quan Dokploy hay Compose tren may ban.

name: CI

# "on" = khi nao pipeline chay.
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

# "jobs" = cac cong viec. Moi job chay tren mot may ao rieng, song song voi nhau.
jobs:
  # --- Job 1: kiem tra source code ---
  lint-and-build:
    runs-on: ubuntu-latest # may ao Ubuntu do GitHub cap, dung xong xoa
    steps:
      # Tai code cua repo ve may ao
      - name: Checkout code
        uses: actions/checkout@v4

      # Cai Node 22 (khop voi node:22-alpine trong Dockerfile), bat cache npm cho nhanh
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      # npm ci = cai dung phien ban trong package-lock.json (nghiem ngat hon npm install)
      - name: Install dependencies
        run: npm ci

      # Chay lint — bao do neu co loi
      - name: Lint
        run: npm run lint

      # Build production — bao do neu TypeScript hoac Vite loi
      - name: Build
        run: npm run build

      # Backend co package-lock rieng, nen cai va kiem tra trong server/.
      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Lint server
        working-directory: server
        run: npm run lint

      - name: Build server
        working-directory: server
        run: npm run build

  # --- Job 2: kiem tra Docker image chay duoc ---
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Build image tu Dockerfile, chi lay stage "runtime" (nginx)
      - name: Build image
        run: docker build --target runtime -t thuccoffee:ci .

      # Chay container, dua cong 80 trong container ra cong 8080 cua may ao
      - name: Run container
        run: docker run -d --name thuccoffee-ci -p 8080:80 thuccoffee:ci

      # Cho container bao "healthy" (Dockerfile co HEALTHCHECK goi /healthz)
      - name: Wait for healthy
        run: |
          for i in $(seq 1 20); do
            status=$(docker inspect --format '{{.State.Health.Status}}' thuccoffee-ci)
            echo "[$i] health: $status"
            [ "$status" = "healthy" ] && exit 0
            sleep 3
          done
          echo "Container khong healthy sau 60s"
          docker logs thuccoffee-ci
          exit 1

      # Kiem tra hanh vi thuc: giong cac lenh curl ban da chay tay luc verify
      - name: Verify HTTP behavior
        run: |
          set -e
          # /healthz phai tra 200 va body "ok"
          body=$(curl -fsS http://127.0.0.1:8080/healthz)
          [ "$body" = "ok" ] || { echo "healthz body sai: $body"; exit 1; }

          # Deep route /menu phai tra 200 (SPA fallback ve index.html)
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/menu)
          [ "$code" = "200" ] || { echo "/menu tra $code, mong 200"; exit 1; }

          # Asset khong ton tai phai tra 404, KHONG duoc roi vao index.html
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/assets/khong-ton-tai.js)
          [ "$code" = "404" ] || { echo "asset thieu tra $code, mong 404"; exit 1; }

          echo "Tat ca kiem tra HTTP deu pass"

      # Don dep — luon chay du buoc truoc that bai
      - name: Cleanup
        if: always()
        run: docker rm -f thuccoffee-ci
